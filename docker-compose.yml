x-app-env: &app-env
    ENV: ${ENV:-local}
    APP_VERSION: dev
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_JSON: ${LOG_JSON:-false}
    CORS_ORIGINS: ${CORS_ORIGINS:-[]}
    SEED_TEST_USERS: ${SEED_TEST_USERS:-false}
    SEED_TEST_PASSWORD: ${SEED_TEST_PASSWORD:-}
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    JWT_TOKEN: ${JWT_TOKEN:-dev-only-insecure-secret-key-change-me!!}
    PUSH__VAPID_KEY_FILE: /var/lib/app/vapid/private_key.pem
    PUSH__VAPID_SUBJECT: ${PUSH__VAPID_SUBJECT:-mailto:admin@example.com}

services:
    db:
        image: postgres:18.6-alpine3.24
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-app}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
            POSTGRES_DB: ${POSTGRES_DB:-app}
        ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
        volumes:
            - pg-data:/var/lib/postgresql
            - ./docker/initdb:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 3s
            timeout: 3s
            retries: 20

    redis:
        image: valkey/valkey:9.1.2-alpine3.24
        ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
        healthcheck:
            test: ["CMD", "valkey-cli", "ping"]
            interval: 3s
            timeout: 3s
            retries: 20

    rustfs:
        image: rustfs/rustfs:1.0.4
        environment:
            RUSTFS_ACCESS_KEY: ${STORAGE__ACCESS_KEY:-travelhub-dev}
            RUSTFS_SECRET_KEY: ${STORAGE__SECRET_KEY:-travelhub-dev-secret}
            RUSTFS_CONSOLE_ENABLE: "false"
        ports: ["127.0.0.1:9000:9000"]
        volumes:
            - rustfs-data:/data
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
            interval: 3s
            timeout: 3s
            retries: 20

    migrate:
        build:
            context: .
            args:
                APP_VERSION: dev
        command: ["alembic", "upgrade", "head"]
        environment: *app-env
        depends_on:
            db:
                condition: service_healthy
        restart: "no"

    api:
        build:
            context: .
            args:
                APP_VERSION: dev
        environment:
            <<: *app-env
            FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-*}"
            RATE_LIMIT_WINDOW_SECONDS:
            RATE_LIMIT_LOGIN:
            RATE_LIMIT_REGISTER:
            RATE_LIMIT_REFRESH:
            RATE_LIMIT_USER:
            STORAGE__ENDPOINT: rustfs:9000
            STORAGE__ACCESS_KEY: ${STORAGE__ACCESS_KEY:-travelhub-dev}
            STORAGE__SECRET_KEY: ${STORAGE__SECRET_KEY:-travelhub-dev-secret}
            STORAGE__BUCKET:
            STORAGE__SECURE: "false"
        volumes:
            - vapid:/var/lib/app/vapid
        depends_on:
            migrate:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
            rustfs:
                condition: service_healthy
            worker:
                condition: service_started

    worker:
        build: .
        command: ["celery", "-A", "app.push.worker:celery", "worker", "--loglevel=INFO", "--concurrency=1"]
        environment: *app-env
        volumes:
            - vapid:/var/lib/app/vapid:ro
        depends_on:
            migrate:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        healthcheck:
            disable: true
        stop_grace_period: 30s
        restart: unless-stopped

    nginx:
        image: nginx:1.30.5-alpine3.24
        ports: ["8000:80"]
        extra_hosts: ["host.docker.internal:host-gateway"]
        volumes:
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./docker/nginx/http.conf:/etc/nginx/http.conf:ro
            - ./docker/nginx/routes.conf:/etc/nginx/routes.conf:ro
        depends_on:
            api:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    pg-data:
    rustfs-data:
    vapid:  # the VAPID key pair: browsers subscribed with its public key
