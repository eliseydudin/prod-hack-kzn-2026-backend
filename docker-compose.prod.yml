x-sage-logs: &sage-logs
  sage.logs: "true"

x-app: &app
  image: ${IMAGE:?IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
  labels: *sage-logs
  environment: &app-environment
    ENV: prod
    APP_VERSION: ${IMAGE_TAG}
    LOG_JSON: "true"
    CORS_ORIGINS: ${CORS_ORIGINS:-[]}

    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    JWT_TOKEN: ${JWT_TOKEN}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    PUSH__VAPID_KEY_FILE: /var/lib/app/vapid/private_key.pem
    PUSH__VAPID_SUBJECT: ${PUSH__VAPID_SUBJECT:-https://${DOMAIN:?DOMAIN is required}}

    FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-*}"

services:
  db:
    image: postgres:18.6-alpine3.24

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: valkey/valkey:9.1.2-alpine3.24
    labels: *sage-logs
    command:
      [
        "valkey-server",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "volatile-lru",
        "--appendonly",
        "yes",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *app
    env_file:
      - path: .env.storage
        required: false
      - path: .env.google-drive
        required: false
    environment:
      <<: *app-environment
      RATE_LIMIT_WINDOW_SECONDS:
      RATE_LIMIT_LOGIN:
      RATE_LIMIT_REGISTER:
      RATE_LIMIT_REFRESH:
      RATE_LIMIT_USER:
    volumes:
      - vapid:/var/lib/app/vapid
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped

  worker:
    <<: *app
    command: ["celery", "-A", "app.push.worker:celery", "worker", "--loglevel=INFO", "--concurrency=1"]
    volumes:
      - vapid:/var/lib/app/vapid:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    stop_grace_period: 30s
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles: ["migrate"] # never started by a plain `up`

  certbot:
    image: certbot/certbot:v5.8.0
    labels: *sage-logs
    entrypoint: ["/bin/sh", "/opt/certbot.sh"]
    init: true
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    volumes:
      - ./certbot/certbot.sh:/opt/certbot.sh:ro
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/certbot
      - tls:/tls
    healthcheck:
      test: ["CMD", "test", "-s", "/tls/fullchain.pem"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  nginx:
    image: nginx:1.30.5-alpine3.24
    labels: *sage-logs
    entrypoint: ["/bin/sh", "/etc/nginx/tls-entrypoint.sh"]
    ports: ["80:80", "443:443"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/http.conf:/etc/nginx/http.conf:ro
      - ./nginx/routes.conf:/etc/nginx/routes.conf:ro
      - ./nginx/tls-entrypoint.sh:/etc/nginx/tls-entrypoint.sh:ro
      - ./nginx/auth:/etc/nginx/auth:ro
      - acme-webroot:/var/www/certbot:ro
      - tls:/etc/nginx/tls:ro
    depends_on:
      api:
        condition: service_healthy
      certbot:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "--no-check-certificate",
          "https://127.0.0.1/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  vector:
    image: timberio/vector:0.58.0-alpine
    command:
      [
        "--config",
        "/etc/vector/vector.toml",
        "--dangerously-allow-env-var-interpolation",
      ]
    environment:
      SAGE__API_KEY: ${SAGE__API_KEY:-}
      SAGE__GROUP: ${SAGE__GROUP:-hack-led-12}
      SAGE__ENV: prod
    volumes:
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector-data:/var/lib/vector
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8686/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  letsencrypt: # certbot account and certificates: keep it, re-issuing is rate-limited
  acme-webroot:
  tls:
  vector-data: # Vector's checkpoints and buffers, safe to lose
  vapid:
