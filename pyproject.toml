[project]
name = "backend-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "airportsdata>=20261103",
    "alembic>=1.20.1",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.7.0",
    "cryptography>=49.0.0",
    "fastapi[standard]>=0.138.0",
    "greenlet>=3.5.2",
    "httpx-oauth>=0.17.0",
    "minio>=7.2.20",
    "pwdlib[argon2]>=0.3.0",
    "py-vapid>=1.9.6",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pypdf>=7.0.0",
    "pytest-cov>=7.1.0",
    "pywebpush>=2.5.0",
    "requests>=2.34.2",
    "ruff>=0.17.4",
    "sqlmodel>=0.0.47",
    "tzdata>=2026.6",
    "valkey>=6.2.0",
]

[dependency-groups]
dev = [
    "http-ece>=1.2.1",
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
