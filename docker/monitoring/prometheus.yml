global:
  scrape_interval: 15s
  scrape_timeout: 5s

storage:
  tsdb:
    retention:
      time: 15d
      size: 2GB

scrape_configs:
  - job_name: telemetry
    static_configs:
      - targets: ["vector:9598"]
        labels: {service: vector}
      - targets: ["loki:3100"]
        labels: {service: loki}

  - job_name: backend-probes
    metrics_path: /probe
    static_configs:
      - targets: ["http://api:8000/health"]
        labels: {service: api, module: http_2xx}
      - targets: ["db:5432"]
        labels: {service: postgres, module: tcp_connect}
      - targets: ["redis:6379"]
        labels: {service: valkey, module: tcp_connect}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
