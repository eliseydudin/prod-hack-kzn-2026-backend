apiVersion: 1

datasources:
  - name: Prometheus
    uid: backend-prometheus
    type: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: backend-loki
    type: loki
    url: http://loki:3100
    access: proxy
    editable: false
