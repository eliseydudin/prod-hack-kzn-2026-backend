# Edge reverse proxy in front of the api (docs/adr/0006). The only public entry point.
# Local stack and CI: plain HTTP. Production terminates TLS itself, see nginx.prod.conf.
# Relative includes resolve next to this file: /etc/nginx/ in the container.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include http.conf;

    server {
        listen 80;
        server_name _;

        include routes.conf;
    }
}
