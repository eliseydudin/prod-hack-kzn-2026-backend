# http-context settings shared by nginx.conf (local, CI) and nginx.prod.conf (TLS).
server_tokens off;
charset utf-8;
default_type application/json;

# Docker's embedded DNS. The upstream is resolved per request (proxy_pass with a
# variable): after `docker compose up -d api` recreates the container with a new
# IP, nginx follows it instead of returning 502 until restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

# Keep the caller's X-Request-ID, or generate one. The api echoes and logs it,
# so one id links the nginx line, the api lines and the client's error body.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format json escape=json
    '{"time":"$time_iso8601","request_id":"$req_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_status":"$upstream_status","upstream_response_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';
access_log /dev/stdout json;
error_log /dev/stderr warn;

client_max_body_size 1m;
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 30s;

gzip on;
gzip_types application/json;
gzip_min_length 1024;

# Behind a cloud load balancer that terminates TLS, trust only its address:
# set_real_ip_from <lb-cidr>;
# real_ip_header X-Forwarded-For;

# The frontend runs in a separate compose project and publishes :3000 on the host.
# host.docker.internal comes from `extra_hosts: host-gateway` of the nginx service and is
# resolved once at start (the api upstream is resolved per request instead).
upstream frontend {
    server host.docker.internal:3000;
}
