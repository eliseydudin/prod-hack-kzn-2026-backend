# server-context settings shared by the HTTP (local) and HTTPS (prod) servers: who serves
# which path, proxy headers and the JSON error contract of nginx itself.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;

# Proxy settings shared by the api and the frontend locations.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Overwrite, never append: a client cannot spoof its IP to dodge the rate limit.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $req_id;

proxy_connect_timeout 2s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
# No retries: POST is not idempotent unless the client sent Idempotency-Key.
proxy_next_upstream off;

# Scraped from inside the network (api:8000/metrics), never exposed publicly.
location = /metrics {
    add_header X-Request-ID $req_id always;
    return 404 '{"error":{"code":"not_found","message":"Not Found","details":[],"request_id":"$req_id"}}';
}

# Photo scanning: the body is the image itself, up to 5 MiB (MAX_PHOTO_BYTES in
# app/application/inventory/scan_items.py), and the vision model may take up to
# LLM__TIMEOUT_SECONDS (30 s). Regex locations match in order: keep it above the next one.
location ~ ^/api/v1/projects/[^/]+/items/scan$ {
    client_max_body_size 6m;
    proxy_read_timeout 45s;
    # error_page of the server level is not inherited once a location has its own.
    error_page 413 = @photo_too_large;
    error_page 502 503 504 = @upstream_unavailable;
    set $upstream http://api:8000;
    proxy_pass $upstream;
}

location @photo_too_large {
    add_header X-Request-ID $req_id always;
    return 413 '{"error":{"code":"photo_too_large","message":"The photo is too large","details":[],"request_id":"$req_id"}}';
}

# Everything the backend serves. The rest of the paths belongs to the frontend, so a
# new top-level api route (not under /api) has to be added to this list.
location ~ ^/(api|health|docs|redoc|openapi\.json)(/|$) {
    set $upstream http://api:8000;
    proxy_pass $upstream;
}

# The web frontend, published by its own compose project on the host's :3000.
location / {
    proxy_pass http://frontend;
}

# Errors produced by nginx itself (api down, timeout) use the API error contract.
# Responses of the api (e.g. 503 from /health/ready) pass through unchanged.
error_page 502 503 504 = @upstream_unavailable;
location @upstream_unavailable {
    add_header Retry-After 5 always;
    add_header X-Request-ID $req_id always;
    return 503 '{"error":{"code":"service_unavailable","message":"Service is temporarily unavailable","details":[],"request_id":"$req_id"}}';
}
