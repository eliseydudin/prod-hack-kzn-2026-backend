# Production edge (docs/adr/0006, docs/adr/0009): same routing as nginx.conf, but nginx
# terminates TLS with a Let's Encrypt certificate that the certbot service keeps in
# /etc/nginx/tls (a self-signed placeholder until the first issuance).
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include http.conf;

    # Plain HTTP serves only the ACME challenge; everything else moves to HTTPS.
    server {
        listen 80;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        # 308, not 301: a client's POST stays a POST instead of turning into a GET.
        location / {
            return 308 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # A year, without includeSubDomains: the parent domain may not be ours.
        add_header Strict-Transport-Security "max-age=31536000" always;

        include routes.conf;
    }
}
